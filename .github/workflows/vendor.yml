name: Récupération des fichiers tiers
on: workflow_dispatch
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out/fonts out/js && cd out
          npm pack @supabase/supabase-js@2.90.0 @fontsource/barlow@5.2.8 @fontsource/barlow-condensed@5.2.8 --silent
          for f in *.tgz; do mkdir -p x && tar -xzf "$f" -C x && mv x "${f%.tgz}"; done
          cp supabase-supabase-js-*/package/dist/umd/supabase.js js/supabase.js
          for w in 400 500 600; do for s in latin latin-ext; do cp fontsource-barlow-5*/package/files/barlow-$s-$w-normal.woff2 fonts/; done; done
          for w in 600 700; do for s in latin latin-ext; do cp fontsource-barlow-condensed-*/package/files/barlow-condensed-$s-$w-normal.woff2 fonts/; done; done
          cp fontsource-barlow-5*/package/LICENSE fonts/OFL.txt || true
          ls -la js fonts
      - run: |
          cd out && git init -q -b vendor-files && git add js/supabase.js fonts
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Fichiers tiers"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vendor-files
