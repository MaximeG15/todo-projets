name: Codes-barres de test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p out && cd out && npm init -y >/dev/null && npm i bwip-js@4 --silent
          cat > gen.js <<'JS'
          const bwipjs=require('bwip-js'),fs=require('fs');
          const L=[
            ['code128','EMPL-A-01-02-03','code128'],
            ['gs1-128','(01)03760123456784(10)LOT2026A(17)271231','gs1-128'],
            ['ean13','3760123456784','ean13'],
            ['datamatrix','A-01-02-03','datamatrix'],
            ['gs1datamatrix','(01)03760123456784(10)LOT2026A(21)SN000123','gs1datamatrix'],
            ['qrcode','SUPPORT:PAL-000123','qrcode']];
          (async()=>{for(const [f,t,b] of L){try{const lin=b.includes('128')||b==='ean13';const png=await bwipjs.toBuffer({bcid:b,text:t,scale:4,...(lin?{height:14}:{}),includetext:b==='ean13',textxalign:'center',paddingwidth:8,paddingheight:8,backgroundcolor:'FFFFFF'});fs.writeFileSync(f+'.png',png);console.log('ok',f)}catch(e){console.log('ERREUR',f,e.message||e)}}})();
          JS
          node gen.js > log.txt 2>&1; cat log.txt; ls -la *.png
          git init -q -b vendor-files && git add *.png log.txt && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Codes-barres de test"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vendor-files
